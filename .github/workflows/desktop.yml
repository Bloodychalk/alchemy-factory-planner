name: Build desktop applications
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-15
            name: macos-arm64
          - os: macos-15-intel
            name: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.6'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: uv sync --frozen --group build --python 3.12
      - name: Prepare private test cache
        run: uv run python -m desktop.main --prepare
      - name: Test calculation rules
        run: node --test tests/planning.test.js
      - name: Test native host
        run: uv run python -m unittest discover -s tests -p "test_*.py"
      - name: Build native application
        run: uv run python scripts/build_desktop.py
      - name: Check standalone command
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath desktop-dist/AlchemyFactoryPlanner/AlchemyFactoryPlanner.exe -ArgumentList '--help' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged executable failed: $($process.ExitCode)" }
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent desktop-dist/AlchemyFactoryPlanner.app desktop-dist/AlchemyFactoryPlanner-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AlchemyFactoryPlanner-${{ matrix.name }}
          path: |
            desktop-dist/*.zip
            desktop-dist/AlchemyFactoryPlanner/**
          retention-days: 14
