name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/build_site.py'
      - 'scripts/check_site.py'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/build_site.py'
      - 'scripts/check_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build public assets only
        run: python scripts/build_site.py
      - name: Check static site
        run: python scripts/check_site.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check JavaScript modules
        run: for file in web/*.js; do node --check "$file"; done
      - name: Prepare verified reference for calculation tests
        run: |
          python -m pip install certifi==2026.10.23
          python -m desktop.main --prepare
      - name: Check calculation regressions
        run: node --test tests/planning.test.js
      - name: Check host and Wiki adapters
        run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
