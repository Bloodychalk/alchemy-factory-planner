name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/build_site.py'
      - 'scripts/check_site.py'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/build_site.py'
      - 'scripts/check_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build public assets only
        run: python scripts/build_site.py
      - name: Check static site
        run: python scripts/check_site.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check JavaScript modules
        run: for file in web/*.js; do node --check "$file"; done
      - name: Select relevant checks
        id: checks
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "push" ] || ! git diff --quiet HEAD^ HEAD -- web/planning.js web/data.js web/runtime.js web/patches.js web/worker.js web/upstream.json data_tools tests; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare verified reference for calculation tests
        if: steps.checks.outputs.full == 'true'
        run: |
          python -m pip install certifi==2026.10.23
          python -m data_tools
      - name: Check calculation regressions
        if: steps.checks.outputs.full == 'true'
        run: node --test tests/planning.test.js
      - name: Check data adapters
        if: steps.checks.outputs.full == 'true'
        run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
