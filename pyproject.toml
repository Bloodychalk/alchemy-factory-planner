[project]
name = "alchemy-factory-planner"
version = "0.1.0"
description = "Alchemy Factory production planner desktop host"
requires-python = ">=3.12"
dependencies = ["pywebview>=6,<7", "certifi>=2025.1.31"]

[dependency-groups]
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
alchemy-planner = "desktop.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["desktop"]
