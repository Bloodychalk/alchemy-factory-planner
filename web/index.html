<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#ff6b6b" />
    <meta
      name="description"
      content="炼金工厂产线计算器：设定净产量，自动推荐原料、机器、燃料与肥料产线。"
    />
    <title>炼金工厂 · 产线计算器</title>
    <link rel="icon" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./"
        ><span class="brand-icon" aria-hidden="true"
          ><svg
            viewBox="0 0 32 32"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path d="M11 4h10M13 4v10L6 26h20l-7-12V4M10 20h12" />
            <path d="M14 23h4" /></svg></span
        ><span>炼金工厂<small>PRODUCTION PLANNER</small></span></a
      >
      <div class="top-actions">
        <a
          href="https://github.com/Bloodychalk/alchemy-factory-planner"
          target="_blank"
          rel="noopener"
          >github仓库</a
        >
      </div>
    </header>
    <main class="workspace">
      <aside class="sidebar">
        <form id="target-form">
          <label for="item-search">目标产物</label>
          <div class="item-picker">
            <input
              id="item-search"
              type="search"
              aria-label="搜索物品"
              placeholder=" "
              autocomplete="off"
              disabled
            />
            <select
              id="target-item"
              aria-label="选择目标产物"
              disabled
            ></select>
          </div>
          <label for="amount">目标净产量</label>
          <div class="quantity">
            <input
              id="amount"
              type="number"
              min="0.000001"
              step="any"
              value="60"
              required
            /><select id="unit" aria-label="产量单位">
              <option value="minute">个 / 分钟</option>
              <option value="second">个 / 秒</option>
              <option value="interval">秒 / 个</option>
            </select>
          </div>
          <p id="rate-hint" class="field-hint">60 个 / 分钟</p>
          <button id="calculate" class="primary" disabled>
            计算推荐产线
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
            >
              <path d="M4 12h16m-6-6 6 6-6 6" />
            </svg></button
          ><button id="cancel" type="button" class="secondary hidden">
            取消计算
          </button>
          <details id="advanced">
            <summary>研究等级与生产设置</summary>
            <div class="detail-content">
              <div class="levels">
                <label
                  >工厂效率<input
                    type="number"
                    id="level-factory"
                    min="0"
                    max="100"
                    value="0" /></label
                ><label
                  >物流效率<input
                    type="number"
                    id="level-logistics"
                    min="0"
                    max="100"
                    value="0" /></label
                ><label
                  >炼金技术<input
                    type="number"
                    id="level-alchemy"
                    min="0"
                    max="100"
                    value="0" /></label
                ><label
                  >燃料效率<input
                    type="number"
                    id="level-fuel"
                    min="0"
                    max="100"
                    value="0" /></label
                ><label
                  >肥料效率<input
                    type="number"
                    id="level-fertilizer"
                    min="0"
                    max="100"
                    value="0" /></label
                ><label
                  >萃取高度<input
                    type="number"
                    id="height"
                    min="0"
                    max="255"
                    value="255"
                /></label>
              </div>
              <label for="fuel">燃料</label
              ><select id="fuel">
                <option value="">自动推荐</option></select
              ><label for="fertilizer">肥料</label
              ><select id="fertilizer">
                <option value="">自动推荐</option></select
              ><label for="recipe">目标配方</label
              ><select id="recipe">
                <option value="">自动推荐</option>
              </select>
              <div id="catalysts" class="hidden">
                <label>高级炼金炉催化剂</label
                ><label class="check"
                  ><input type="checkbox" id="catalyst-unstable" />不稳定</label
                ><label class="check"
                  ><input type="checkbox" id="catalyst-fertile" />丰饶</label
                ><label class="check"
                  ><input type="checkbox" id="catalyst-resonant" />共振</label
                ><label class="check"
                  ><input type="checkbox" id="catalyst-eternal" />永恒</label
                >
              </div>
              <div id="custom-input-row" class="hidden">
                <label for="custom-input">悖论投入物品</label
                ><select id="custom-input"></select>
              </div>
              <label class="check"
                ><input
                  id="recycle"
                  type="checkbox"
                  checked
                />回收可利用副产物</label
              ><label class="check"
                ><input
                  id="cauldron"
                  type="checkbox"
                  checked
                />比较炼金锅组合路线</label
              ><label for="heater">加热设备</label
              ><select id="heater"></select>
            </div>
          </details>
        </form>
        <div class="data-panel">
          <div class="data-title">配方资料 <span id="data-count">—</span></div>
          <p id="data-source" class="field-hint"></p>
          <div class="data-buttons">
            <button id="import-data" class="small">导入 JSON</button
            ><button id="export-data" class="small" disabled>导出资料</button>
          </div>
        </div>
      </aside>
      <section class="results" aria-label="计算结果">
        <div class="result-top">
          <h2 id="result-title"></h2>
          <div class="result-actions">
            <button id="load-plan" class="small">打开方案</button
            ><button id="save-plan" class="small" disabled>保存方案</button>
          </div>
        </div>
        <div id="message" role="alert" class="message error hidden"></div>
        <div id="output" class="hidden">
          <div class="metrics">
            <article>
              <span>目标净交付</span><strong id="metric-output">—</strong
              ><small>个 / 分钟</small>
            </article>
            <article>
              <span>持续采购</span><strong id="metric-cost">—</strong
              ><small>铜 / 分钟</small>
            </article>
            <article>
              <span>生产与供热机器</span><strong id="metric-machines">—</strong
              ><small>台 · 整数建造数</small>
            </article>
            <article>
              <span>实际加工热耗</span><strong id="metric-heat">—</strong
              ><small>热量 / 秒</small>
            </article>
          </div>
          <div class="viewbar">
            <div class="tabs" role="tablist" aria-label="展示方式">
              <button id="tab-text" role="tab" aria-selected="true">
                简介模式</button
              ><button id="tab-graph" role="tab" aria-selected="false">
                图形模式-总览
              </button>
              <button id="tab-detail" role="tab" aria-selected="false">
                图形模式-详细
              </button>
            </div>
            <div>
              <button id="copy" class="small">复制简介</button
              ><button id="export-text" class="small">导出文字</button>
            </div>
          </div>
          <div id="text-view" role="tabpanel">
            <div class="section-title">
              <h3>采购与供给</h3>
            </div>
            <div id="purchases" class="purchase-list"></div>
            <div class="section-title">
              <h3>建造清单</h3>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>加工与配方</th>
                    <th>建造台数</th>
                    <th>利用率</th>
                    <th>产出 / 分钟</th>
                  </tr>
                </thead>
                <tbody id="steps"></tbody>
              </table>
            </div>
          </div>
          <div id="detail-view" class="hidden" role="tabpanel">
            <div id="detail-error" role="alert" class="hidden"></div>
            <div class="detail-tools">
              <button id="detail-fit" class="small">适配视图</button
              ><button
                id="detail-zoom-in"
                class="small"
                aria-label="放大详细图"
              >
                <svg
                  aria-hidden="true"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="3"
                >
                  <path d="M12 4v16M4 12h16" />
                </svg></button
              ><button
                id="detail-zoom-out"
                class="small"
                aria-label="缩小详细图"
              >
                <svg
                  aria-hidden="true"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="3"
                >
                  <path d="M4 12h16" />
                </svg></button
              ><span id="detail-count"></span>
            </div>
            <div id="detail-canvas"></div>
            <pre id="detail-inspect" class="hidden"></pre>
          </div>
          <div id="graph-view" role="tabpanel" class="hidden">
            <iframe
              id="graph"
              title="产线流程图"
              sandbox="allow-scripts"
            ></iframe>
          </div>
        </div>
      </section>
    </main>
    <input
      type="file"
      id="file-input"
      accept=".json,application/json"
      class="hidden"
    />
    <script type="module" src="./app.js"></script>
  </body>
</html>
